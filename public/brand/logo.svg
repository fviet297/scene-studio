<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Titanium Tech — abstract geometric mark</title>
  <desc id="desc">An angular, abstract emblem inspired by a hidden V, using titanium silver, electric blue, amber gold, and transparent negative space.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset=".48" stop-color="#94A3B8"/><stop offset="1" stop-color="#DCE5F0"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#1742A6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  </defs>
  <!-- The mark is intentionally asymmetric: interlocking hard-edged facets suggest motion and a hidden V without spelling it literally. -->
  <g stroke-linejoin="miter">
    <path d="M72 104 H198 L305 229 L268 274 L180 181 H112 Z" fill="url(#silver)"/>
    <path d="M84 190 L150 190 L250 337 L218 398 Z" fill="url(#blue)"/>
    <path d="M309 216 L395 110 H458 L347 251 Z" fill="url(#amber)"/>
    <path d="M263 281 L319 219 L357 257 L286 337 Z" fill="url(#silver)"/>
    <path d="M250 337 L286 337 L255 388 L218 398 Z" fill="url(#amber)"/>
    <path d="M319 219 L353 181 L380 181 L347 251 Z" fill="#F8FAFC"/>
    <path d="M198 104 L231 104 L339 229 L305 229 Z" fill="#0B132B"/>
  </g>
</svg>
